services:
  agent-core:
    build: .
    image: agent-core:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8900:8900"
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    volumes:
      - agent-data:/data
      - agent-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0

volumes:
  agent-data:
  agent-workspace:
