server:
  host: "0.0.0.0"
  port: 8900
  auth_token: "${AUTH_TOKEN}"
  max_request_bytes: 1048576
  cors_origins: []
  rate_limit_per_minute: 300
  max_concurrent_runs: 10
  log_format: "json"

llm:
  base_url: "https://api.openai.com/v1"
  api_key: "${LLM_API_KEY}"
  model: "gpt-4o"
  context_window: 128000
  max_tool_iterations: 15
  max_retries: 3
  temperature: 0.7
  max_output_tokens: 4096
  max_run_tokens: 100000
  run_timeout_seconds: 1800
  fallbacks: []

embedding:
  base_url: "https://api.openai.com/v1"
  api_key: "${EMBEDDING_API_KEY}"
  model: "text-embedding-3-small"
  dimensions: 1536

store:
  db_path: "/data/agent/agent.db"
  vector_backend: "sqlite"

workspace:
  path: "/workspace"
  soul_file: "SOUL.md"

compression:
  threshold_percent: 0.50
  protect_first_n: 3
  protect_last_n: 20
  target_ratio: 0.20

tools:
  approval_mode: "build"
  terminal_enabled: false
  progressive_tools: true
  tool_search_threshold: 10
  enabled_toolsets: []

memory:
  capacity_limit: 200
  consolidation_threshold: 160
  auto_nudge: true
  auto_consolidate: false

security:
  policies: []
