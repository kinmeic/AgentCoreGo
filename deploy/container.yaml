# Runtime semantics pinned to ZCode v3.17.2 / a9fe401e.
# server/llm/workspace are independent Go service deployment/provider settings.
server:
  host: "0.0.0.0"
  port: 3030
  auth_token: "${AUTH_TOKEN}"
  terminalEnabled: false # An OS shell, not a sandbox; false for non-loopback binding.
  max_request_bytes: 1048576
  cors_origins: []
  rate_limit_per_minute: 300
  max_concurrent_runs: 10

llm:
  api_format: openai # openai Chat Completions or anthropic Messages
  base_url: https://api.openai.com/v1
  api_key: "${LLM_API_KEY}"
  model: "" # Required for chat: set LLM_MODEL or select an actual provider model ID.
  context_window: 200000 # Set actual model capability; fallback follows ZCode.
  max_output_tokens: 32000 # Set actual model capability.
  reasoning_effort: ""
  expose_reasoning: true
  thinking_type: auto
  thinking_budget_tokens: 16000
  fallbacks: []

workspace:
  path: /workspace # AGENTS.md and file tools share this root.
storage:
  dir: /data # Isolated Go service data; never opens ZCode Desktop's DB by default.
  sessionDbPath: /data/agent/agent.db

modelStream:
  idleTimeoutMs: 600000
network:
  timeout: 180000 # milliseconds
  # httpProxy: http://127.0.0.1:7890
  # noProxy: localhost,127.0.0.1,.example.com
  # caCertFile: /absolute/path/to/ca.pem
permission:
  mode: build # build, edit, guarded, yolo, plan; auto is reserved and denies tools.
  allowedTools: []
  disallowedTools: []
  autoApproveHighRisk: false
  alwaysAskTerminal: false
  allowMediumRiskInAuto: false
logging:
  level: info
  format: json
toolConcurrency:
  maxConcurrency: 10
modelAnomalyGuard:
  repeatedToolCallWarningThreshold: 3
  maxBudgetWarningsPerTurn: 3
  # toolCallWarningThreshold: 100 # Advisory only; unset by default.
features:
  compact: true
  rewind: true
  subagent: true
  memory: true
  skill: true
  mcp: true
memory:
  use: true
skills:
  enabled: true
  includeInstructions: true
  metadataBudget: 20000
  roots: []
skill: {} # /absolute/path/to/SKILL.md: {enable: false}
command: {} # /absolute/path/to/command.md: {enable: false}
mcp:
  servers: {} # See README for stdio/http/sse declarations.
ui:
  locale: en-US
  theme: auto
