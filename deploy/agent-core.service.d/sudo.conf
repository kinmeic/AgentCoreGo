# Optional, high-risk override for passwordless sudo from run_terminal.
# Install manually only with permission.alwaysAskTerminal=true and narrow sudoers rules.
# The base service still runs as User=agent-core; this does not make it root.
[Service]
NoNewPrivileges=no
RestrictSUIDSGID=no
ProtectSystem=off
ProtectHome=off
PrivateDevices=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectControlGroups=no
PrivateTmp=no
LockPersonality=no
ReadWritePaths=
