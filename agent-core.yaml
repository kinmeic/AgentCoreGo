server:
  host: "127.0.0.1"
  port: 8900
  auth_token: "${AUTH_TOKEN}"
  max_request_bytes: 1048576
  cors_origins: [] # Exact origins only, for example https://app.example.com
  rate_limit_per_minute: 300
  max_concurrent_runs: 10
  log_format: "text" # text or json

llm:
  base_url: "https://api.openai.com/v1"
  api_key: "${LLM_API_KEY}"
  model: "gpt-4o"
  context_window: 128000
  max_tool_iterations: 15
  max_retries: 3
  temperature: 0.7
  max_output_tokens: 4096
  max_run_tokens: 100000
  run_timeout_seconds: 1800
  reasoning_effort: "" # Optional; only for compatible providers
  fallbacks: []

embedding:
  base_url: "https://api.openai.com/v1"
  api_key: "${EMBEDDING_API_KEY}"
  model: "text-embedding-3-small"
  dimensions: 1536

store:
  db_path: "./data/agent.db"
  vector_backend: "sqlite" # sqlite, legacy alias sqlite-vec, or none

workspace:
  path: "./workspace" # Single source for SOUL.md and all workspace tools
  soul_file: "SOUL.md"

compression:
  threshold_percent: 0.50
  protect_first_n: 3
  protect_last_n: 20
  target_ratio: 0.20

tools:
  # tools.work_dir is a legacy alias; prefer workspace.path and do not set both.
  approval_mode: "smart" # smart/build, plan, edit, guarded, or yolo
  # The terminal is NOT an OS sandbox. It must be false on non-loopback deployments.
  terminal_enabled: true
  progressive_tools: true
  tool_search_threshold: 10
  enabled_toolsets: [] # Empty enables core, web, memory, mcp, and host_callback

memory:
  capacity_limit: 200
  consolidation_threshold: 160
  auto_nudge: true
  auto_consolidate: false

security:
  policies: []
  # Example:
  # policies:
  #   - name: deny-privileged-shell
  #     effect: deny
  #     resource: terminal
  #     conditions:
  #       - field: target
  #         operator: regex
  #         values: ['(^|\\s)sudo(\\s|$)']

features:
  skills: true
  commands: true
  subagents: true
  workflow: true
  model_io: true

ui:
  locale: "zh-CN" # auto, en-US, or zh-CN

skills:
  roots: [] # Additional directories containing */SKILL.md
  metadata_budget: 8192

commands:
  roots: [] # Additional directories containing Markdown commands
  metadata_budget: 8192
  max_command_bytes: 100000

workflow:
  enabled: true
  roots: [] # Declarative YAML/JSON DAG definitions only
  max_nodes: 100
  max_concurrency: 4
  max_agent_calls: 50
  timeout_seconds: 1800

telemetry:
  mode: "redacted" # redacted diagnostics or explicit training capture
  directory: "./data/model-io"
  queue_size: 256
  max_artifact_bytes: 4194304
  retention_files: 100
